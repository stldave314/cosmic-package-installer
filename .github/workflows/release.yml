name: Release

# Releases are tag-triggered: pushing a `v*` tag builds every package format
# and attaches them to the GitHub Release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    # Creating the release and attaching the artefacts is a write to the
    # repository, which the default token is not granted unless it is asked for.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev \
            libwayland-dev \
            libudev-dev \
            libinput-dev \
            libgbm-dev \
            libseat-dev \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      # `install.sh` is the single build path: what CI produces here is built
      # exactly the way a local `./install.sh all` builds it, including the
      # `release-build` feature that compiles diagnostic logging out.
      - name: Build packages
        run: ./install.sh all

      - name: List artefacts
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          generate_release_notes: true
